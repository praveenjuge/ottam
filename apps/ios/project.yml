name: Ottam
options:
  bundleIdPrefix: com.praveenjuge
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.3.8
  ClerkConvex:
    url: https://github.com/clerk/clerk-convex-swift.git
    from: 0.1.0
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift.git
    from: 0.8.1
settings:
  base:
    DEVELOPMENT_TEAM: LW385M78LW
    SWIFT_VERSION: 6.2
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: true
targets:
  Ottam:
    type: application
    platform: iOS
    sources:
      - Ottam
    info:
      path: Ottam/Info.plist
      properties:
        CFBundleDisplayName: Ottam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        NSMotionUsageDescription: Ottam uses motion to pause stories when you stop and select supportive walking or running scene variants.
        OTTAMClerkPublishableKey: "$(OTTAM_CLERK_PUBLISHABLE_KEY)"
        OTTAMConvexURL: "$(OTTAM_CONVEX_URL)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - fetch
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ClerkConvex
        product: ClerkConvex
      - package: ConvexMobile
        product: ConvexMobile
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Ottam/Ottam.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenjuge.ottam
        PRODUCT_NAME: Ottam
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          OTTAM_CLERK_DOMAIN: known-caiman-38.clerk.accounts.dev
          OTTAM_CLERK_PUBLISHABLE_KEY: pk_test_a25vd24tY2FpbWFuLTM4LmNsZXJrLmFjY291bnRzLmRldiQ
          OTTAM_CONVEX_URL: https://wary-caribou-993.eu-west-1.convex.cloud
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          OTTAM_CLERK_DOMAIN: clerk.ottam.praveenjuge.com
          OTTAM_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsub3R0YW0ucHJhdmVlbmp1Z2UuY29tJA
          OTTAM_CONVEX_URL: https://uncommon-jellyfish-660.convex.cloud
          PROVISIONING_PROFILE_SPECIFIER: Ottam App Store Distribution
  OttamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OttamTests
    dependencies:
      - target: Ottam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenjuge.ottam.tests
  OttamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OttamUITests
    dependencies:
      - target: Ottam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenjuge.ottam.ui-tests
